# The highlights of each release for the "What's new" section, newest first: a few short entries, one emoji each.
# A release without an entry here shows only the link to its release notes.

[[release]]
version = "0.5.0"
changes = [
  { emoji = "🎛️", text = "Camera and time controls right in the preview" },
  { emoji = "☀️", text = "A new camera mode that faces the Sun while Earth turns below" },
  { emoji = "🚀", text = "Start automatically when you log in" },
  { emoji = "🎯", text = "The preview and the wallpaper now match exactly" },
]

